<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="minionEyeLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </radialGradient>
    <radialGradient id="minionIris" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="90%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <linearGradient id="goggleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Goggle Straps -->
  <rect x="0" y="42" width="16" height="16" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="84" y="42" width="16" height="16" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

  <!-- Goggle Outer Metallic Bezel -->
  <circle cx="50" cy="50" r="38" fill="url(#goggleRing)" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Rivets / Bolts on Rim -->
  <circle cx="50" cy="16" r="2" fill="#334155"/>
  <circle cx="50" cy="84" r="2" fill="#334155"/>
  <circle cx="16" cy="50" r="2" fill="#334155"/>
  <circle cx="84" cy="50" r="2" fill="#334155"/>
  <circle cx="26" cy="26" r="2" fill="#334155"/>
  <circle cx="74" cy="26" r="2" fill="#334155"/>
  <circle cx="26" cy="74" r="2" fill="#334155"/>
  <circle cx="74" cy="74" r="2" fill="#334155"/>

  <!-- Inner Bezel -->
  <circle cx="50" cy="50" r="31" fill="#475569" stroke="#0f172a" stroke-width="2"/>

  <!-- Eyeball Sclera -->
  <circle cx="50" cy="50" r="28" fill="url(#minionEyeLens)"/>

  <!-- Iris (Hazel Brown) -->
  <circle cx="50" cy="50" r="15" fill="url(#minionIris)"/>

  <!-- Pupil -->
  <circle cx="50" cy="50" r="7" fill="#0f172a"/>

  <!-- Catchlight / Gaze Glint -->
  <circle cx="46" cy="46" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="53" cy="53" r="1.2" fill="#ffffff" opacity="0.6"/>
</svg>
